kind = "web"
previewPath = "/"
title = "Pure and Gentle — Water Refiner Landing Page"
version = "1.0.0"
id = "artifacts/pure-gentle-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23141

[services.development]
run = "pnpm --filter @workspace/pure-gentle-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pure-gentle-landing", "run", "build" ]
publicDir = "artifacts/pure-gentle-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23141"
BASE_PATH = "/"
